    # CONFIRMED MORAI-SIDE LIMITATION (not a scenario_runner/map-data bug):
    # diagnostic logging (grpc_client.py's set_vehicle_route rejection log) shows
    # MORAI's own routing engine returns description='NOT_FOUND_PATH' for every
    # NPC route ending at the south/east/north exits (A219BS010436/442/071),
    # regardless of start link or route length/complexity -- while routes ending
    # at the west exit (A219BS010452) always succeed. link_set.json/node_set.json
    # were already verified byte-identical in structure across all four exits, so
    # MORAI's internal routing graph (likely built at NGII map import time) simply
    # doesn't have these three junctions registered as reachable, independent of
    # our HD map JSON. This isn't fixable from scenario_runner code; it would need
    # MORAI's own map editor/importer to re-validate R_KR_PG_KATRI. Restricting to
    # the one confirmed-working exit is the permanent workaround.
    npc_exit_links:
      - A219BS010452
